[package]
name = "rust_lib_vnt_app"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
windows-service-host = ["dep:windows-service", "dep:windows-sys"]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]

serde = { version = "1.0", features = ["derive"] }
flutter_rust_bridge = "=2.1.0"
vnt-core = { version = "=2.0.0", path = "../vendor/vnt-core-2.0.0" }
anyhow = "1.0.82"
tokio = { version = "1.37.0", features = ["full"] }
rust-p2p-core = "0.4"
ipnet = "2.11"
serde_json = "1.0"

log = "0.4.17"
log4rs = "=1.2.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = { version = "=0.8.1", optional = true }
windows-sys = { version = "=0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[patch.crates-io]
tun-rs = { path = "../vendor/tun-rs-2.5.7" }
